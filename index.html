<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Debt Settlement Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-4 px-3 sm:p-6 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl p-4 sm:p-6 md:p-10">
        <!-- Header -->
        <div class="mb-6 sm:mb-8 text-center sm:text-left">
            <h1 class="text-2xl sm:text-3xl font-bold mb-1 sm:mb-2">Poker Debt Settlement Assistant</h1>
            <p class="text-sm sm:text-base text-slate-500">Calculate your game results and minimize transactions.</p>
        </div>

        <!-- Edit Modal -->
        <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-2xl w-full max-w-sm">
                <h2 class="text-xl font-bold mb-4">Edit Player</h2>
                <input id="edit-id" type="hidden">
                <label class="block text-sm font-medium mb-1">Name</label>
                <input id="edit-name" class="border border-slate-300 p-2.5 rounded-lg w-full mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <label class="block text-sm font-medium mb-1">Buy-in</label>
                <input id="edit-buyin" type="number" class="border border-slate-300 p-2.5 rounded-lg w-full mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <label class="block text-sm font-medium mb-1">Re-buys</label>
                <input id="edit-rebuy" type="number" class="border border-slate-300 p-2.5 rounded-lg w-full mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <label class="block text-sm font-medium mb-1">Final Stack</label>
                <input id="edit-stack" type="number" class="border border-slate-300 p-2.5 rounded-lg w-full mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="flex gap-2">
                    <button onclick="saveEdit()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-semibold flex-1 hover:bg-indigo-700 transition">Save</button>
                    <button onclick="closeEdit()" class="bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold flex-1 hover:bg-slate-300 transition">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div id="input-section" class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200 mb-6">
            <h2 class="font-semibold text-base sm:text-lg mb-3">Add Player</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-4">
                <input id="p-name" placeholder="Name" class="border border-slate-300 p-3 rounded-xl w-full bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="p-buyin" type="number" placeholder="Buy-in" class="border border-slate-300 p-3 rounded-xl w-full bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="p-rebuy" type="number" placeholder="Re-buys" class="border border-slate-300 p-3 rounded-xl w-full bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="p-stack" type="number" placeholder="Final Stack" class="border border-slate-300 p-3 rounded-xl w-full bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="addPlayer()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700 transition w-full sm:w-auto shadow-sm">Add Player</button>
        </div>

        <!-- Players List View Switcher & Table Container -->
        <div class="mt-6">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-semibold text-base sm:text-lg">Players Overview</h2>
            </div>
            
            <!-- Desktop/Tablet Table View -->
            <div id="players-list" class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="border-b bg-slate-50 text-slate-600 text-sm">
                            <th class="p-3.5">Player</th>
                            <th class="p-3.5">Total Invested</th>
                            <th class="p-3.5">Stack</th>
                            <th class="p-3.5">Net</th>
                            <th class="p-3.5 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="players-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    <tfoot id="players-footer" class="bg-slate-100/70 font-bold border-t-2 border-slate-200 text-sm"></tfoot>
                </table>
            </div>

            <!-- Mobile Card View (Optimized for small screens) -->
            <div id="players-cards" class="grid grid-cols-1 gap-3 sm:hidden mt-3">
                <!-- Dynamically populated cards for mobile view -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-6 flex flex-col sm:flex-row gap-3">
            <button onclick="calculateDebts()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-emerald-700 transition w-full sm:w-auto shadow-sm text-center">Generate Settlement</button>
            <button onclick="resetApp()" class="bg-slate-200 text-slate-700 px-6 py-3 rounded-xl font-semibold hover:bg-slate-300 transition w-full sm:w-auto text-center">Reset</button>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="mt-6 hidden p-5 sm:p-6 bg-slate-100 rounded-2xl border border-slate-200"></div>
    </div>

    <script>
        let players = [
            { id: 1, name: 'Player 1', buyin: 200, rebuy: 0, stack: 200 },
            { id: 2, name: 'Player 2', buyin: 200, rebuy: 0, stack: 200 },
            { id: 3, name: 'Player 3', buyin: 200, rebuy: 0, stack: 200 },
            { id: 4, name: 'Player 4', buyin: 200, rebuy: 0, stack: 200 },
            { id: 5, name: 'Player 5', buyin: 200, rebuy: 0, stack: 200 }
        ];

        function addPlayer() {
            const name = document.getElementById('p-name').value.trim() || `Player ${players.length + 1}`;
            const buyin = parseFloat(document.getElementById('p-buyin').value) || 0;
            const rebuy = parseFloat(document.getElementById('p-rebuy').value) || 0;
            const stack = parseFloat(document.getElementById('p-stack').value) || 0;

            players.push({ id: Date.now(), name, buyin, rebuy, stack });
            updateTable();
            document.getElementById('p-name').value = '';
            document.getElementById('p-buyin').value = '';
            document.getElementById('p-rebuy').value = '';
            document.getElementById('p-stack').value = '';
        }

        function deletePlayer(id) {
            players = players.filter(p => p.id !== id);
            updateTable();
        }

        function openEdit(id) {
            const p = players.find(player => player.id === id);
            if (!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-buyin').value = p.buyin;
            document.getElementById('edit-rebuy').value = p.rebuy;
            document.getElementById('edit-stack').value = p.stack;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEdit() { document.getElementById('edit-modal').classList.add('hidden'); }

        function saveEdit() {
            const id = parseInt(document.getElementById('edit-id').value);
            const p = players.find(player => player.id === id);
            if (p) {
                p.name = document.getElementById('edit-name').value.trim();
                p.buyin = parseFloat(document.getElementById('edit-buyin').value) || 0;
                p.rebuy = parseFloat(document.getElementById('edit-rebuy').value) || 0;
                p.stack = parseFloat(document.getElementById('edit-stack').value) || 0;
            }
            updateTable();
            closeEdit();
        }

        function updateTable() {
            const body = document.getElementById('players-body');
            const cardsContainer = document.getElementById('players-cards');
            const footer = document.getElementById('players-footer');
            
            // SVG Icons for Edit (Pencil) and Delete (Trash)
            const editIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`;
            const deleteIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;

            // Populate Desktop Table View
            body.innerHTML = players.map(p => {
                const invested = p.buyin + p.rebuy;
                const net = p.stack - invested;
                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-3.5 font-medium">${p.name}</td>
                        <td class="p-3.5">${invested}</td>
                        <td class="p-3.5">${p.stack}</td>
                        <td class="p-3.5 font-bold ${net >= 0 ? 'text-emerald-600' : 'text-red-600'}">${net}</td>
                        <td class="p-3.5 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="openEdit(${p.id})" title="Edit" class="p-1.5 rounded-lg text-indigo-600 hover:bg-indigo-50 transition">${editIcon}</button>
                                <button onclick="deletePlayer(${p.id})" title="Delete" class="p-1.5 rounded-lg text-red-600 hover:bg-red-50 transition">${deleteIcon}</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // Populate Mobile Card View
            cardsContainer.innerHTML = players.map(p => {
                const invested = p.buyin + p.rebuy;
                const net = p.stack - invested;
                return `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <span class="font-bold text-base text-slate-800">${p.name}</span>
                            <span class="font-bold text-base ${net >= 0 ? 'text-emerald-600' : 'text-red-600'}">Net: ${net}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 py-1">
                            <div><span class="block text-slate-400">Total Invested</span><strong class="text-slate-700">${invested}</strong></div>
                            <div><span class="block text-slate-400">Stack</span><strong class="text-slate-700">${p.stack}</strong></div>
                        </div>
                        <div class="flex justify-end items-center pt-2 border-t border-slate-100">
                            <div class="flex items-center gap-1">
                                <button onclick="openEdit(${p.id})" title="Edit" class="p-1.5 rounded-lg text-indigo-600 hover:bg-indigo-50 transition">${editIcon}</button>
                                <button onclick="deletePlayer(${p.id})" title="Delete" class="p-1.5 rounded-lg text-red-600 hover:bg-red-50 transition">${deleteIcon}</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const totalInv = players.reduce((s, p) => s + p.buyin + p.rebuy, 0);
            const totalStack = players.reduce((s, p) => s + p.stack, 0);
            const totalNet = players.reduce((s, p) => s + (p.stack - (p.buyin + p.rebuy)), 0);

            footer.innerHTML = `<tr><td class="p-3.5">Total</td><td class="p-3.5">${totalInv}</td><td class="p-3.5">${totalStack}</td><td class="p-3.5 ${totalNet === 0 ? 'text-slate-900' : 'text-red-600'}">${totalNet}</td><td class="p-3.5"></td></tr>`;
        }

        function calculateDebts() {
            const resultDiv = document.getElementById('result-section');
            const list = players.map(p => ({ ...p, net: p.stack - (p.buyin + p.rebuy) }));
            const sum = list.reduce((a, b) => a + b.net, 0);
            resultDiv.classList.remove('hidden');

            if (Math.abs(sum) > 0.1) {
                resultDiv.innerHTML = `<h3 class="text-red-600 font-bold text-lg mb-1">Error! Settlement Imbalanced</h3><p class="text-sm text-slate-600">Total net is ${sum.toFixed(2)}. The sum of all final stacks must equal total investments (Balance must be 0).</p>`;
                return;
            }

            let creditors = list.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
            let debtors = list.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
            let steps = [];

            creditors.forEach(c => {
                debtors.forEach(d => {
                    if (d.net < 0 && c.net > 0) {
                        let val = Math.min(c.net, Math.abs(d.net));
                        steps.push(`<strong>${d.name}</strong> pays <strong>${c.name}</strong>: <span class="text-emerald-700 font-semibold">${val.toFixed(2)}</span>`);
                        c.net -= val; d.net += val;
                    }
                });
            });

            resultDiv.innerHTML = `
                <h3 class="text-lg sm:text-xl font-bold mb-3 text-slate-800">Optimized Settlement Plan</h3>
                <ul class="space-y-2 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">${steps.map(s => `<li class="text-sm sm:text-base flex items-center gap-2">🔹 ${s}</li>`).join('')}</ul>
                <p class="mt-3 text-xs sm:text-sm text-slate-500">Verification: All balances settled with minimal transactions.</p>
            `;
        }

        function resetApp() { 
            players = []; 
            updateTable(); 
            document.getElementById('result-section').classList.add('hidden'); 
        }
        
        window.onload = updateTable;
    </script>
</body>
</html>
