<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Debt Settlement Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-10">
        <h1 class="text-3xl font-bold mb-2">Poker Debt Settlement Assistant</h1>
        <p class="text-slate-500 mb-8">Calculate your game results and minimize transactions.</p>

        <!-- Edit Modal -->
        <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm">
                <h2 class="text-xl font-bold mb-4">Edit Player</h2>
                <input id="edit-id" type="hidden">
                <label class="block text-sm font-medium mb-1">Name</label>
                <input id="edit-name" class="border p-2 rounded-lg w-full mb-3">
                <label class="block text-sm font-medium mb-1">Buy-in</label>
                <input id="edit-buyin" type="number" class="border p-2 rounded-lg w-full mb-3">
                <label class="block text-sm font-medium mb-1">Re-buys</label>
                <input id="edit-rebuy" type="number" class="border p-2 rounded-lg w-full mb-3">
                <label class="block text-sm font-medium mb-1">Final Stack</label>
                <input id="edit-stack" type="number" class="border p-2 rounded-lg w-full mb-4">
                <div class="flex gap-2">
                    <button onclick="saveEdit()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg flex-1">Save</button>
                    <button onclick="closeEdit()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg flex-1">Cancel</button>
                </div>
            </div>
        </div>

        <div id="input-section" class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <h2 class="font-semibold mb-3">Add Player</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <input id="p-name" placeholder="Name" class="border p-3 rounded-lg w-full">
                <input id="p-buyin" type="number" placeholder="Buy-in" class="border p-3 rounded-lg w-full">
                <input id="p-rebuy" type="number" placeholder="Re-buys" class="border p-3 rounded-lg w-full">
                <input id="p-stack" type="number" placeholder="Final Stack" class="border p-3 rounded-lg w-full">
            </div>
            <button onclick="addPlayer()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition w-full md:w-auto">Add Player</button>
        </div>

        <div id="players-list" class="mt-8 overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b bg-slate-50">
                        <th class="p-3">Player</th>
                        <th class="p-3">Buy-in</th>
                        <th class="p-3">Re-buys</th>
                        <th class="p-3">Total Invested</th>
                        <th class="p-3">Stack</th>
                        <th class="p-3">Net</th>
                        <th class="p-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="players-body"></tbody>
                <tfoot id="players-footer" class="bg-slate-100 font-bold border-t-2 border-slate-200"></tfoot>
            </table>
        </div>

        <div class="mt-8 flex gap-4">
            <button onclick="calculateDebts()" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">Generate Settlement</button>
            <button onclick="resetApp()" class="bg-slate-200 text-slate-700 px-6 py-3 rounded-lg font-semibold hover:bg-slate-300 transition">Reset</button>
        </div>

        <div id="result-section" class="mt-8 hidden p-6 bg-slate-100 rounded-xl"></div>
    </div>

    <script>
        let players = [
            { id: 1, name: 'Player 1', buyin: 200, rebuy: 0, stack: 200 },
            { id: 2, name: 'Player 2', buyin: 200, rebuy: 0, stack: 200 },
            { id: 3, name: 'Player 3', buyin: 200, rebuy: 0, stack: 200 },
            { id: 4, name: 'Player 4', buyin: 200, rebuy: 0, stack: 200 },
            { id: 5, name: 'Player 5', buyin: 200, rebuy: 0, stack: 200 }
        ];

        function addPlayer() {
            const name = document.getElementById('p-name').value || `Player ${players.length + 1}`;
            const buyin = parseFloat(document.getElementById('p-buyin').value) || 0;
            const rebuy = parseFloat(document.getElementById('p-rebuy').value) || 0;
            const stack = parseFloat(document.getElementById('p-stack').value) || 0;

            players.push({ id: Date.now(), name, buyin, rebuy, stack });
            updateTable();
            document.getElementById('p-name').value = '';
            document.getElementById('p-buyin').value = '';
            document.getElementById('p-rebuy').value = '';
            document.getElementById('p-stack').value = '';
        }

        function deletePlayer(id) {
            players = players.filter(p => p.id !== id);
            updateTable();
        }

        function openEdit(id) {
            const p = players.find(player => player.id === id);
            if (!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-buyin').value = p.buyin;
            document.getElementById('edit-rebuy').value = p.rebuy;
            document.getElementById('edit-stack').value = p.stack;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEdit() { document.getElementById('edit-modal').classList.add('hidden'); }

        function saveEdit() {
            const id = parseInt(document.getElementById('edit-id').value);
            const p = players.find(player => player.id === id);
            if (p) {
                p.name = document.getElementById('edit-name').value;
                p.buyin = parseFloat(document.getElementById('edit-buyin').value) || 0;
                p.rebuy = parseFloat(document.getElementById('edit-rebuy').value) || 0;
                p.stack = parseFloat(document.getElementById('edit-stack').value) || 0;
            }
            updateTable();
            closeEdit();
        }

        function updateTable() {
            const body = document.getElementById('players-body');
            const footer = document.getElementById('players-footer');
            
            body.innerHTML = players.map(p => {
                const invested = p.buyin + p.rebuy;
                const net = p.stack - invested;
                return `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="p-3">${p.name}</td>
                        <td class="p-3">${p.buyin}</td>
                        <td class="p-3">${p.rebuy}</td>
                        <td class="p-3">${invested}</td>
                        <td class="p-3">${p.stack}</td>
                        <td class="p-3 font-bold ${net >= 0 ? 'text-emerald-600' : 'text-red-600'}">${net}</td>
                        <td class="p-3 space-x-2">
                            <button onclick="openEdit(${p.id})" class="text-blue-600 hover:text-blue-800 underline">Edit</button>
                            <button onclick="deletePlayer(${p.id})" class="text-red-600 hover:text-red-800 underline">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');

            const totalInv = players.reduce((s, p) => s + p.buyin + p.rebuy, 0);
            const totalStack = players.reduce((s, p) => s + p.stack, 0);
            const totalNet = players.reduce((s, p) => s + (p.stack - (p.buyin + p.rebuy)), 0);

            footer.innerHTML = `<tr><td class="p-3">Total</td><td class="p-3">-</td><td class="p-3">-</td><td class="p-3">${totalInv}</td><td class="p-3">${totalStack}</td><td class="p-3">${totalNet}</td><td class="p-3"></td></tr>`;
        }

        function calculateDebts() {
            const resultDiv = document.getElementById('result-section');
            const list = players.map(p => ({ ...p, net: p.stack - (p.buyin + p.rebuy) }));
            const sum = list.reduce((a, b) => a + b.net, 0);
            resultDiv.classList.remove('hidden');

            if (Math.abs(sum) > 0.1) {
                resultDiv.innerHTML = `<h3 class="text-red-600 font-bold">Error!</h3><p>Total net is ${sum.toFixed(2)}. Balance must be 0 for settlement.</p>`;
                return;
            }

            let creditors = list.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
            let debtors = list.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
            let steps = [];

            creditors.forEach(c => {
                debtors.forEach(d => {
                    if (d.net < 0 && c.net > 0) {
                        let val = Math.min(c.net, Math.abs(d.net));
                        steps.push(`${d.name} pays ${c.name}: ${val.toFixed(2)}`);
                        c.net -= val; d.net += val;
                    }
                });
            });

            resultDiv.innerHTML = `<h3 class="text-xl font-bold mb-4">Settlement</h3><ul class="list-disc pl-5 space-y-1">${steps.map(s => `<li>${s}</li>`).join('')}</ul><p class="mt-4 text-sm text-slate-500">Verification: All debts settled.</p>`;
        }

        function resetApp() { players = []; updateTable(); document.getElementById('result-section').classList.add('hidden'); }
        window.onload = updateTable;
    </script>
</body>
</html>
